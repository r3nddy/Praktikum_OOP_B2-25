<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="1050" fill="#ffffff"/>

  <!-- ============ KELAS ============ -->

  <!-- PaketHosting (abstract) -->
  <g>
    <rect x="420" y="20" width="320" height="280" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="580" y="48" text-anchor="middle" font-size="16" font-weight="bold" font-style="italic">PaketHosting</text>
    <text x="580" y="70" text-anchor="middle" font-size="13" font-style="italic">&#171;abstract&#187;</text>
    <line x1="420" y1="84" x2="740" y2="84" stroke="#111"/>
    <text x="430" y="104" font-size="13"># id_paket : str</text>
    <text x="430" y="122" font-size="13"># nama : str</text>
    <text x="430" y="140" font-size="13"># penyimpanan_gb : int</text>
    <text x="430" y="158" font-size="13"># bandwidth_gb : int</text>
    <text x="430" y="176" font-size="13">- harga : float</text>
    <line x1="420" y1="190" x2="740" y2="190" stroke="#111"/>
    <text x="430" y="210" font-size="13">+ hitung_total_harga() : float</text>
    <text x="430" y="228" font-size="13">+ deskripsi_layanan() : str</text>
    <text x="430" y="246" font-size="13">+ tampilkan_info() : void</text>
    <text x="430" y="264" font-size="13">+ jalankan() : void</text>
    <text x="430" y="282" font-size="13">+ __lt__(other) : bool</text>
  </g>

  <!-- SharedHosting -->
  <g>
    <rect x="150" y="400" width="270" height="160" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="285" y="426" text-anchor="middle" font-size="15" font-weight="bold">SharedHosting</text>
    <line x1="150" y1="438" x2="420" y2="438" stroke="#111"/>
    <text x="160" y="458" font-size="13">+ maks_domain : int</text>
    <line x1="150" y1="474" x2="420" y2="474" stroke="#111"/>
    <text x="160" y="494" font-size="13">+ hitung_total_harga() : float</text>
    <text x="160" y="512" font-size="13">+ deskripsi_layanan() : str</text>
    <text x="160" y="530" font-size="13">+ tampilkan_info() : void</text>
  </g>

  <!-- VPSHosting -->
  <g>
    <rect x="740" y="400" width="270" height="160" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="875" y="426" text-anchor="middle" font-size="15" font-weight="bold">VPSHosting</text>
    <line x1="740" y1="438" x2="1010" y2="438" stroke="#111"/>
    <text x="750" y="458" font-size="13">+ jumlah_core : int</text>
    <text x="750" y="476" font-size="13">+ sistem_operasi : str</text>
    <line x1="740" y1="490" x2="1010" y2="490" stroke="#111"/>
    <text x="750" y="510" font-size="13">+ hitung_total_harga() : float</text>
    <text x="750" y="528" font-size="13">+ deskripsi_layanan() : str</text>
    <text x="750" y="546" font-size="13">+ tampilkan_info() : void</text>
  </g>

  <!-- Server -->
  <g>
    <rect x="60" y="630" width="300" height="230" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="210" y="656" text-anchor="middle" font-size="15" font-weight="bold">Server</text>
    <line x1="60" y1="668" x2="360" y2="668" stroke="#111"/>
    <text x="70" y="688" font-size="13">+ id_server : str</text>
    <text x="70" y="706" font-size="13">+ nama : str</text>
    <text x="70" y="724" font-size="13">+ lokasi : str</text>
    <text x="70" y="742" font-size="13">+ status : str</text>
    <text x="70" y="760" font-size="13">- alamat ip : str</text>
    <text x="70" y="778" font-size="13">+ hardware : SpesifikasiHardware</text>
    <text x="70" y="796" font-size="13">+ paket : List~PaketHosting~</text>
    <line x1="60" y1="810" x2="360" y2="810" stroke="#111"/>
    <text x="70" y="830" font-size="13">+ tambah_paket(paket) : void</text>
    <text x="70" y="848" font-size="13">+ tampilkan_info() : void</text>
  </g>

  <!-- Klien -->
  <g>
    <rect x="500" y="630" width="300" height="210" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="650" y="656" text-anchor="middle" font-size="15" font-weight="bold">Klien</text>
    <line x1="500" y1="668" x2="800" y2="668" stroke="#111"/>
    <text x="510" y="688" font-size="13">+ id_klien : str</text>
    <text x="510" y="706" font-size="13">+ nama : str</text>
    <text x="510" y="724" font-size="13">+ email : str</text>
    <text x="510" y="742" font-size="13">- __kata_sandi : str</text>
    <text x="510" y="760" font-size="13">+ paket_langganan : List~PaketHosting~</text>
    <line x1="500" y1="774" x2="800" y2="774" stroke="#111"/>
    <text x="510" y="794" font-size="13">+ berlangganan(paket) : void</text>
    <text x="510" y="812" font-size="13">+ ping_server(server) : void</text>
    <text x="510" y="830" font-size="13">+ tampilkan_info() : void</text>
  </g>

  <!-- SpesifikasiHardware -->
  <g>
    <rect x="60" y="900" width="270" height="130" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="195" y="926" text-anchor="middle" font-size="15" font-weight="bold">SpesifikasiHardware</text>
    <line x1="60" y1="938" x2="330" y2="938" stroke="#111"/>
    <text x="70" y="958" font-size="13">+ cpu : str</text>
    <text x="70" y="976" font-size="13">+ ram_gb : int</text>
    <text x="70" y="994" font-size="13">+ tipe_storage : str</text>
    <line x1="60" y1="1004" x2="330" y2="1004" stroke="#111"/>
    <text x="70" y="1022" font-size="13">+ __str__() : str</text>
  </g>

  <!-- LayananTagihan -->
  <g>
    <rect x="1010" y="60" width="250" height="125" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <text x="1135" y="86" text-anchor="middle" font-size="15" font-weight="bold">LayananTagihan</text>
    <line x1="1010" y1="98" x2="1260" y2="98" stroke="#111"/>
    <text x="1020" y="118" font-size="13">+ nama_layanan : str</text>
    <line x1="1010" y1="132" x2="1260" y2="132" stroke="#111"/>
    <text x="1020" y="152" font-size="13">+ total(daftar_paket) : float</text>
    <text x="1020" y="170" font-size="13">+ cetak_tagihan(nama, daftar)</text>
  </g>

  <!-- ============ RELASI ============ -->

  <!-- Pewarisan: SharedHosting ke PaketHosting (segitiga kosong) -->
  <line x1="285" y1="400" x2="500" y2="300" stroke="#111" stroke-width="1.5"/>
  <polygon points="500,300 487,315 480,300" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="330" y="350" font-size="12" fill="#333">pewarisan</text>

  <!-- Pewarisan: VPSHosting ke PaketHosting -->
  <line x1="875" y1="400" x2="660" y2="300" stroke="#111" stroke-width="1.5"/>
  <polygon points="660,300 680,315 673,300" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="790" y="350" font-size="12" fill="#333">pewarisan</text>

  <!-- Agregasi: Server ke PaketHosting (belah ketupat kosong di Server) -->
  <polyline points="60,700 30,700 30,270 420,270" fill="none" stroke="#111" stroke-width="1.5"/>
  <polygon points="60,700 48,692 36,700 48,708" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="44" y="310" font-size="12" fill="#333">agregasi 1</text>
  <text x="200" y="262" font-size="12" fill="#333">0..*</text>

  <!-- Agregasi: Klien ke PaketHosting (belah ketupat kosong di Klien) -->
  <line x1="620" y1="630" x2="620" y2="300" stroke="#111" stroke-width="1.5"/>
  <polygon points="620,630 628,618 620,606 612,618" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="630" y="470" font-size="12" fill="#333">agregasi 0..*</text>

  <!-- Asosiasi: Klien ke Server -->
  <line x1="500" y1="700" x2="360" y2="700" stroke="#111" stroke-width="1.5"/>
  <polyline points="374,693 360,700 374,707" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="395" y="692" font-size="12" fill="#333">asosiasi</text>

  <!-- Komposisi: Server ke SpesifikasiHardware (belah ketupat terisi di Server) -->
  <line x1="210" y1="884" x2="210" y2="900" stroke="#111" stroke-width="1.5"/>
  <polygon points="210,860 218,872 210,884 202,872" fill="#111" stroke="#111" stroke-width="1.5"/>
  <text x="228" y="880" font-size="12" fill="#333">komposisi 1 .. 1</text>

  <!-- Dependensi: LayananTagihan ke PaketHosting -->
  <line x1="1010" y1="120" x2="740" y2="150" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="754,155 740,150 753,142" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="790" y="112" font-size="12" fill="#333">&#171;use&#187; (SOLID: DIP)</text>

  <!-- ============ LEGENDA ============ -->
  <g>
    <rect x="860" y="880" width="380" height="150" fill="#fafafa" stroke="#999"/>
    <text x="880" y="906" font-size="14" font-weight="bold">Legenda</text>
    <line x1="880" y1="928" x2="920" y2="928" stroke="#111"/>
    <polygon points="920,928 908,922 908,934" fill="#fff" stroke="#111"/>
    <text x="935" y="933" font-size="12">pewarisan (segitiga kosong)</text>
    <rect x="876" y="942" width="28" height="10" fill="#111"/>
    <polygon points="876,947 864,941 864,953" fill="#111"/>
    <text x="935" y="953" font-size="12">komposisi (belah ketupat terisi)</text>
    <rect x="876" y="962" width="28" height="10" fill="#fff" stroke="#111"/>
    <polygon points="876,967 864,961 864,973" fill="#fff" stroke="#111"/>
    <text x="935" y="973" font-size="12">agregasi (belah ketupat kosong)</text>
    <line x1="876" y1="988" x2="904" y2="988" stroke="#111"/>
    <text x="935" y="993" font-size="12">asosiasi (garis/panah biasa)</text>
    <line x1="876" y1="1008" x2="904" y2="1008" stroke="#111" stroke-dasharray="5 3"/>
    <text x="935" y="1013" font-size="12">dependensi (garis putus-putus)</text>
  </g>
</svg>